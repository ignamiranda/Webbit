name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up Android keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          fi

      - name: Build APK
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK for upload
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
            # split-per-abi produces app-<abi>-release.apk
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              ABI=$(echo "$f" | sed 's/.*app-\(.*\)-release\.apk/\1/')
              cp "$f" "Webbit-${VERSION}-${ABI}.apk"
            done
          else
            VERSION="${SHORT}"
            cp build/app/outputs/flutter-apk/app-debug.apk "Webbit-${VERSION}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Webbit-*.apk

  release:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Generate release tag and name
        id: tag
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Webbit ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            SHA="${{ github.sha }}"
            SHORT="${SHA:0:7}"
            echo "tag=auto-${SHORT}" >> $GITHUB_OUTPUT
            echo "name=Webbit auto-build (${SHORT})" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: "*.apk"
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
